<!DOCTYPE html>

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0d14;
    font-family:'Courier New',monospace;color:#e8e8f0;user-select:none;-webkit-user-select:none;
    touch-action:none;position:fixed}
  #game{position:absolute;inset:0;image-rendering:pixelated;image-rendering:crisp-edges;
    display:block;background:#1a2a1a;touch-action:none}
  #hud{position:absolute;inset:0;pointer-events:none;display:block;touch-action:none}
  #menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#1b2540,#070910 70%);
    z-index:10;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  #menu h1{font-size:clamp(18px,3.2vw,34px);letter-spacing:4px;color:#ffd76e;
    text-shadow:0 0 18px #ffb02080,0 4px 0 #6b4a00;text-align:center}
  #menu .sub{color:#8fa5c0;font-size:13px;letter-spacing:2px;margin-top:-10px;text-align:center}
  #menu .tip{color:#5f7291;font-size:11px;text-align:center;max-width:400px;margin-top:8px}
  #classes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
  .card{width:132px;background:linear-gradient(180deg,#1b2438,#111726);
    border:2px solid #2e3d5c;border-radius:8px;padding:10px 8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:.15s;position:relative;touch-action:manipulation}
  .card:hover,.card:active{border-color:#ffd76e;transform:translateY(-4px);
    box-shadow:0 8px 24px #ffb02033,0 0 0 1px #ffd76e44 inset}
  .card canvas{image-rendering:pixelated;width:78px;height:90px}
  .card .nm{font-size:13px;font-weight:bold;color:#ffe9a8;letter-spacing:1px}
  .card .wp{font-size:10px;color:#7d90ad;text-align:center;line-height:1.3}
  .card .st{font-size:9px;color:#5f7291;text-align:center}
  @media (max-width:500px){
    .card{width:calc(50% - 6px);max-width:150px}
    #menu h1{font-size:20px;letter-spacing:2px}
  }

<script>
"use strict";
/* ============================================================
   0. БАЗОВЫЕ УТИЛИТЫ
   ============================================================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const TAU=Math.PI*2;
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function hash(x,y,s){const n=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453123;return n-Math.floor(n);}
function vnoise(x,y,s){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function fbm(x,y,s,oct){
  oct=oct||3;let a=0,amp=0.5,f=1;
  for(let i=0;i<oct;i++){a+=vnoise(x*f,y*f,s+i*13.7)*amp;amp*=0.5;f*=2;}
  return a;
}
function R(g,x,y,w,h,c){if(w<=0||h<=0)return;g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function ellipseFill(g,cx,cy,rx,ry,col){
  g.fillStyle=col;
  for(let y=-ry;y<=ry;y++){
    const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));
    if(w>0)g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2,1);
  }
}

/* ============================================================
   1. БИОМЫ
   ============================================================ */
const BIOMES={
  forest:{name:'Тёмный лес',ground:['#3d6636','#456e3c','#37602f','#4b7542'],
    detail:['#2e4f28','#598a4a','#6b9a55','#27461f'],patch:'#31562a',map:'#3f6b3a',
    tree:'oak',treeChance:0.135,rockChance:0.012},
  plains:{name:'Зелёные луга',ground:['#6aa84f','#74b356','#63a049','#7cbb5e'],
    detail:['#8ecb6a','#5a9142','#9ed47a','#a8dd85'],patch:'#5f9a45',map:'#6aa84f',
    tree:'oak',treeChance:0.032,rockChance:0.008},
  desert:{name:'Пустыня',ground:['#d9c07a','#e0c885','#cfb46e','#e6d090'],
    detail:['#c2a862','#eddfae','#b89c58','#f2e6bb'],patch:'#cbb271',map:'#dcc47f',
    tree:'cactus',treeChance:0.026,rockChance:0.013},
  swamp:{name:'Гнилые топи',ground:['#4a5d3a','#42543a','#54683f','#3c4b33'],
    detail:['#5d7346','#33422c','#6b8250','#2b3826'],patch:'#3a4a30',map:'#4a5d3a',
    tree:'dead',treeChance:0.10,rockChance:0.010},
  snow:{name:'Снежные пустоши',ground:['#dfe9f0','#e8f0f5','#d3e0ea','#eef5fa'],
    detail:['#c3d3e0','#ffffff','#b8cbdb','#ffffff'],patch:'#cfdde8',map:'#e2ecf3',
    tree:'pine',treeChance:0.09,rockChance:0.012}
};
function biomeAt(x,y){
  const t=fbm(x*0.00070,y*0.00070,3.1,3);
  const m=fbm(x*0.00090+11.3,y*0.00090+7.7,19.4,3);
  if(t>0.60&&m<0.47)return 'desert';
  if(t<0.365)return 'snow';
  if(m>0.605)return 'swamp';
  if(m>0.485)return 'forest';
  return 'plains';
}

/* ============================================================
   2. КАНВА / МАСШТАБ (адаптивный)
   ============================================================ */
const G=document.getElementById('game'),gctx=G.getContext('2d');
const HUD=document.getElementById('hud'),hctx=HUD.getContext('2d');
let VW=480,VH=300,SCALE=3,CSSW=0,CSSH=0;
const IS_TOUCH_DEVICE = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ||
  /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

function resize(){
  CSSW = window.innerWidth;
  CSSH = window.innerHeight;
  const base = Math.min(CSSW / 440, CSSH / 280);
  SCALE = Math.max(1.5, Math.min(4, base));
  VW = Math.ceil(CSSW / SCALE);
  VH = Math.ceil(CSSH / SCALE);
  G.width = VW; G.height = VH;
  G.style.width = CSSW + 'px'; G.style.height = CSSH + 'px';
  HUD.width = CSSW; HUD.height = CSSH;
  HUD.style.width = CSSW + 'px'; HUD.style.height = CSSH + 'px';
  gctx.imageSmoothingEnabled = false;
  hctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));
resize();

/* ============================================================
   3. ТАЙЛЫ
   ============================================================ */
const TS=32,CHUNK=16,CHUNK_PX=TS*CHUNK;
const TILE_CACHE={};
function makeTile(biome,v){
  const c=document.createElement('canvas');c.width=TS;c.height=TS;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;
  const bd=BIOMES[biome];
  g.fillStyle=bd.ground[v];g.fillRect(0,0,TS,TS);
  for(let i=0;i<5;i++){
    const px=Math.floor(hash(i*3+v,v+9,6)*TS),py=Math.floor(hash(i*5+v,v+17,8)*TS);
    g.globalAlpha=0.30;g.fillStyle=bd.patch;
    g.fillRect(px,py,4+Math.floor(hash(i,v,3)*4),3);
    g.globalAlpha=1;
  }
  for(let i=0;i<70;i++){
    const px=Math.floor(hash(i+v*7+1,v*13+3,3)*TS);
    const py=Math.floor(hash(i+v*11+2,v*5+4,4)*TS);
    g.fillStyle=bd.detail[i%bd.detail.length];
    g.fillRect(px,py,1,1);
  }
  if(biome==='forest'||biome==='plains'){
    for(let i=0;i<5;i++){
      const px=Math.floor(hash(i+v*3,v+31,7)*TS),py=Math.floor(hash(i+v*7,v+41,9)*TS);
      g.fillStyle=bd.detail[1];
      g.fillRect(px,py,1,2);g.fillRect(px+1,py,1,1);
      g.fillStyle=bd.detail[2];g.fillRect(px+2,py+1,1,1);
    }
  } else if(biome==='desert'){
    for(let i=0;i<3;i++){
      const py=Math.floor(hash(i+v,v+51,7)*TS);
      g.fillStyle='#c8ac67';g.fillRect(4,py,24,1);
    }
  } else if(biome==='snow'){
    for(let i=0;i<8;i++){
      const px=Math.floor(hash(i+v*5,v+61,7)*TS),py=Math.floor(hash(i+v*9,v+71,9)*TS);
      g.fillStyle='#ffffff';g.fillRect(px,py,1,1);
    }
  } else if(biome==='swamp'){
    for(let i=0;i<3;i++){
      const px=Math.floor(hash(i+v,v+81,7)*TS),py=Math.floor(hash(i+v*3,v+91,9)*TS);
      g.fillStyle='#2c3a24';g.fillRect(px,py,5,2);
      g.fillStyle='#5d7346';g.fillRect(px+1,py-1,3,1);
    }
  }
  return c;
}
function buildTiles(){
  for(const k in BIOMES){
    TILE_CACHE[k]=[];
    for(let v=0;v<4;v++)TILE_CACHE[k].push(makeTile(k,v));
  }
}

/* ============================================================
   4. ЧАНКИ / ДЕКОР
   ============================================================ */
const chunks=new Map();
const DECOR_R={oak:8,pine:7,dead:6,cactus:7,rock:9};
function genChunk(cx,cy){
  const tiles=[],decor=[];
  for(let ty=0;ty<CHUNK;ty++)for(let tx=0;tx<CHUNK;tx++){
    const wx=(cx*CHUNK+tx)*TS,wy=(cy*CHUNK+ty)*TS;
    const b=biomeAt(wx+TS*0.5,wy+TS*0.5);
    const v=Math.floor(hash(cx*CHUNK+tx,cy*CHUNK+ty,5)*4);
    tiles.push({biome:b,v:v});
    const bd=BIOMES[b];
    const dv=hash(cx*CHUNK+tx,cy*CHUNK+ty,9);
    const ox=wx+6+hash(tx+1,ty+3,21)*20;
    const oy=wy+6+hash(tx+5,ty+7,22)*20;
    if(dv<bd.treeChance){
      decor.push({type:bd.tree,x:ox,y:oy,r:DECOR_R[bd.tree],seed:Math.floor(hash(tx+13,ty+29,23)*9973)});
    } else if(dv<bd.treeChance+bd.rockChance){
      decor.push({type:'rock',x:ox,y:oy,r:DECOR_R.rock,seed:Math.floor(hash(tx+31,ty+17,27)*9973)});
    }
  }
  return {tiles,decor,cx,cy};
}
function getChunk(cx,cy){
  const k=cx+','+cy;
  let c=chunks.get(k);
  if(!c){c=genChunk(cx,cy);chunks.set(k,c);}
  return c;
}

/* ============================================================
   5. СТРУКТУРЫ
   ============================================================ */
const STRUCT_CELL=1150;
const structures=new Map();
const STRUCT_INFO={
  forest:{type:'altar',name:'Древний алтарь'},
  plains:{type:'fort',name:'Руины форта'},
  desert:{type:'pyramid',name:'Забытая пирамида'},
  swamp:{type:'hut',name:'Хижина ведьмы'},
  snow:{type:'castle',name:'Ледяная крепость'}
};
function genStructure(cx,cy){
  const key=cx+','+cy;
  if(structures.has(key))return structures.get(key);
  let s=null;
  const h=hash(cx+7,cy+3,77);
  if(h<0.52){
    const wx=cx*STRUCT_CELL+hash(cx,cy,78)*620+260;
    const wy=cy*STRUCT_CELL+hash(cx,cy,79)*620+260;
    if(Math.hypot(wx,wy)>750){
      const b=biomeAt(wx,wy);
      s={x:wx,y:wy,biome:b,type:STRUCT_INFO[b].type,name:STRUCT_INFO[b].name,
         id:key,bossSpawned:false,killed:false,boss:null};
    }
  }
  structures.set(key,s);
  return s;
}
function getStructuresNear(x,y,rad){
  rad=rad||900;
  const c0=Math.floor((x-rad)/STRUCT_CELL),c1=Math.floor((x+rad)/STRUCT_CELL);
  const r0=Math.floor((y-rad)/STRUCT_CELL),r1=Math.floor((y+rad)/STRUCT_CELL);
  const out=[];
  for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++){
    const s=genStructure(cx,cy);
    if(s)out.push(s);
  }
  return out;
}

/* ============================================================
   7. РИСОВАНИЕ ЧЕЛОВЕКОПОДОБНЫХ
   ============================================================ */
function drawWeapon(g,type,hx,hy,ang,p,atk){
  const ca=Math.cos(ang),sa=Math.sin(ang);
  const px=i=>hx+ca*i, py=i=>hy+sa*i;
  if(type==='sword'||type==='greatsword'||type==='dagger'){
    const len=type==='dagger'?9:type==='greatsword'?18:13;
    R(g,px(-3)-1,py(-3)-1,3,3,'#5a3a1e');
    R(g,px(0)-1,py(0)-1,3,3,'#d8b23a');
    for(let i=1;i<=len;i++){
      const w=i>len*0.85?1:2;
      R(g,px(i),py(i),w,w,p.blade);
    }
    R(g,px(len+1),py(len+1),1,1,'#ffffff');
  } else if(type==='dual'){
    for(const s of [-1,1]){
      const a2=ang+s*0.55;const c2=Math.cos(a2),s2=Math.sin(a2);
      for(let i=1;i<=8;i++)R(g,hx+c2*i,hy+s2*i,2,2,p.blade);
      R(g,hx-1,hy-1,2,2,'#5a3a1e');
    }
  } else if(type==='axe'){
    R(g,px(-3)-1,py(-3)-1,3,3,'#5a3a1e');
    for(let i=1;i<=10;i++)R(g,px(i),py(i),2,2,'#6b4a2a');
    const hx2=px(11),hy2=py(11);
    R(g,hx2-4,hy2-5,9,10,p.blade);
    R(g,hx2-5,hy2-3,2,6,p.blade);
    R(g,hx2-4,hy2-5,9,2,'#ffffff');
  } else if(type==='spear'){
    for(let i=-4;i<=16;i++)R(g,hx+ca*i,hy+sa*i,2,2,'#6b4a2a');
    const tx=hx+ca*18,ty=hy+sa*18;
    R(g,tx-1,ty-1,4,4,p.blade);
    R(g,tx,ty,2,2,'#ffffff');
  } else if(type==='staff'){
    R(g,hx-1,hy-8,3,18,'#6b4a2a');
    const ox=hx,oy=hy-11;
    ellipseFill(g,ox+1,oy,4,4,'#1a1440');
    ellipseFill(g,ox+1,oy,3,3,p.blade);
    ellipseFill(g,ox+1,oy,2,2,'#ffffff');
  } else if(type==='bow'){
    const bx=hx+4,by=hy;
    for(let i=-7;i<=7;i++){
      const t=Math.abs(i)/7;
      const dx=Math.round((1-t*t)*4);
      R(g,bx+dx,by+i,2,2,'#8a5a2a');
    }
    R(g,bx+4,by-7,1,15,'#d8d8c0');
    if(atk>=0&&atk<0.45)R(g,bx-2,by-1,7,2,'#e8e0c0');
  }
}

function humanoid(g,o){
  const p=o.pal;
  const w=(o.walk==null)?null:o.walk;
  const sw=w==null?0:Math.sin(w*TAU);

function sprSlime(g,e,t){
  const hop=Math.abs(Math.sin(e.animT*3.0));
  const yOff=-hop*6;
  const squash=1-hop*0.20;
  const W=20,H=15*squash;
  const base=e.col||'#4bb04b', dark=e.col2||'#2f7a2f', light=e.col3||'#8ce88c';
  g.globalAlpha=0.22;ellipseFill(g,0,-1,10,4,'#000');g.globalAlpha=1;
  for(let i=0;i<H;i++){
    const tt=(i+1)/H;
    const ww=Math.round(W*Math.sqrt(Math.max(0,1-(1-tt)*(1-tt))));
    R(g,-ww/2,yOff-H+i,ww,1, i<H*0.25?light:base);
  }
  R(g,-W/2+1,yOff-2,W-2,2,dark);
  R(g,-W/2+3,yOff-H+2,3,2,'#ffffff');
  const ey=yOff-H*0.55;
  R(g,-6,ey,3,4,'#ffffff');R(g,3,ey,3,4,'#ffffff');
  R(g,-5,ey+1,2,2,'#101820');R(g,4,ey+1,2,2,'#101820');
  R(g,-6,ey,1,1,'#ffffff');R(g,3,ey,1,1,'#ffffff');
  R(g,-1,yOff-H*0.28,2,1,'#1a2a1a');
  if(e.crown){
    R(g,-6,yOff-H-3,12,3,'#ffd76e');R(g,-6,yOff-H-6,2,3,'#ffd76e');
    R(g,-1,yOff-H-7,2,4,'#ffd76e');R(g,4,yOff-H-6,2,3,'#ffd76e');
  }
}

}

/* Keyboard */

  keys[e.key.toLowerCase()]=true;

});

/* Mouse (desktop) */

  mouse.sx=e.clientX;mouse.sy=e.clientY;
});

});

});

/* Touch (mobile) */
function onTouchStart(e){
  isTouch=true;
  if(gameState!=='playing')return;
  e.preventDefault();
  for(const t of e.changedTouches){
    const x=t.clientX,y=t.clientY;
    if(!touchState.attack.active){
      const ab=atkBtnPos();
      if(Math.hypot(x-ab.x,y-ab.y)<ATK_RADIUS+18){
        touchState.attack.active=true;
        touchState.attack.id=t.identifier;
        continue;
      }
    }
    if(!touchState.joystick.active && x<CSSW*0.6){
      touchState.joystick.active=true;
      touchState.joystick.id=t.identifier;
      touchState.joystick.baseX=x;
      touchState.joystick.baseY=y;
      touchState.joystick.touchX=x;
      touchState.joystick.touchY=y;
    }
  }
}
function onTouchMove(e){
  if(gameState!=='playing')return;
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===touchState.joystick.id){
      touchState.joystick.touchX=t.clientX;
      touchState.joystick.touchY=t.clientY;
    }
  }
}
function onTouchEnd(e){
  if(gameState!=='playing')return;
  for(const t of e.changedTouches){
    if(t.identifier===touchState.joystick.id){
      touchState.joystick.active=false;
      touchState.joystick.id=null;
    }
    if(t.identifier===touchState.attack.id){
      touchState.attack.active=false;
      touchState.attack.id=null;
    }
  }
}
window.addEventListener('touchstart',onTouchStart,{passive:false});
window.addEventListener('touchmove',onTouchMove,{passive:false});
window.addEventListener('touchend',onTouchEnd,{passive:false});
window.addEventListener('touchcancel',onTouchEnd,{passive:false});
window.addEventListener('contextmenu',e=>{if(gameState==='playing')e.preventDefault();});

    col:m.col,col2:m.col2,col3:m.col3,eyeCol:m.eyeCol,crown:!!m.crown,pal:m.pal,isBoss:false

function spawnBoss(s){
  if(activeBoss&&!activeBoss.dead)return;
  const b=BOSSES[s.biome];
  const e={type:'boss_'+s.biome,sprite:b.sprite,name:b.name,
    x:s.x+rand(-30,30),y:s.y+rand(20,50),facing:1,scale:2,r:b.r,

    xp:b.xp,aggro:420,atkRange:44,atkCd:1.4,ranged:false,attackT:-1,atkTimer:1,
    hitFlash:0,hitDone:false,animT:Math.random()*10,moving:false,wanderT:0,wanderAng:0,
    col:b.col,col2:b.col2,col3:b.col3,eyeCol:b.eyeCol,crown:b.crown,pal:b.pal,isBoss:true};
  enemies.push(e);activeBoss=e;s.boss=e;s.bossSpawned=true;
}
function updateSpawner(dt){
  spawnTimer-=dt;if(spawnTimer>0)return;
  spawnTimer=1.1;if(enemies.length>=MAX_ENEMIES)return;
  const dFS=Math.hypot(player.x,player.y);
  const tier=1+dFS/1600;
  const ang=Math.random()*TAU;
  const rad=Math.max(VW,VH)*0.62+rand(40,180);
  const sx=player.x+Math.cos(ang)*rad,sy=player.y+Math.sin(ang)*rad;
  const b=biomeAt(sx,sy);
  const pool=[];
  for(const k in MONSTERS){
    const m=MONSTERS[k];
    if(m.minDist>dFS)continue;
    let w=m.weight;if(m.minDist>0)w*=0.5+Math.min(2.5,tier*0.8);
    pool.push({k,w});
  }
  if(!pool.length)return;
  let total=pool.reduce((a,b)=>a+b.w,0);
  let pick=Math.random()*total,type=pool[0].k;
  for(const p of pool){pick-=p.w;if(pick<=0){type=p.k;break;}}
  const groupSize=randInt(2,5);
  for(let i=0;i<groupSize;i++){
    const gx=sx+rand(-45,45),gy=sy+rand(-45,45);
    if(biomeAt(gx,gy)!==b)continue;
    enemies.push(makeEnemy(type,gx,gy,tier));
  }
}

function burst(x,y,color,n,spd){
  n=n||6;
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,s=rand(20,spd||90);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:rand(0.25,0.55),max:0.55,color,size:randInt(1,2)});
  }
}
function addFloater(x,y,text,color){floaters.push({x,y,text,color,life:0.85,max:0.85});}

/* ============================================================
   16. БОЙ
   ============================================================ */
function damageEnemy(e,dmg,isCrit){
  if(e.hp<=0)return;
  const d=Math.round(dmg*(isCrit?1.8:1));
  e.hp-=d;e.hitFlash=0.12;
  addFloater(e.x+rand(-4,4),e.y-e.r*2.2-6,(isCrit?'✦':'')+d,isCrit?'#ffd76e':'#ffffff');
  burst(e.x,e.y-e.r*1.3,isCrit?'#ffd76e':'#ff6a5a',isCrit?8:5,110);
  if(e.hp<=0){
    e.hp=0;e.dead=true;
    burst(e.x,e.y-e.r,'#ff8a5a',12,150);
    player.xp+=e.xp;player.kills++;
    addFloater(e.x,e.y-e.r*2.5,'+'+e.xp+' xp','#8ce88c');
    if(e.isBoss){
      activeBoss=null;
      for(const s of structures.values()){if(s&&s.boss===e){s.killed=true;s.boss=null;}}
      addFloater(e.x,e.y-40,'ПОБЕЖДЁН!','#ffd76e');
      burst(e.x,e.y-10,'#ffd76e',40,220);
    }
    while(player.xp>=player.xpNext){
      player.xp-=player.xpNext;player.level++;
      player.xpNext=Math.round(player.xpNext*1.35);
      player.maxhp+=8;player.hp=Math.min(player.maxhp,player.hp+20);
      player.dmgMult+=0.12;
      addFloater(player.x,player.y-40,'УРОВЕНЬ '+player.level+'!','#ffd76e');
      burst(player.x,player.y-14,'#ffd76e',20,160);
    }
  }
}
function damagePlayer(dmg){
  if(player.invuln>0)return;
  player.hp-=dmg;player.invuln=0.62;
  addFloater(player.x,player.y-34,'-'+Math.round(dmg),'#ff5a5a');
  burst(player.x,player.y-10,'#ff4a4a',8,110);
  if(player.hp<=0){
    player.hp=0;gameState='dead';
    document.getElementById('menu').style.display='flex';
    document.getElementById('menu').innerHTML=
      '<h1>ТЫ ПАЛ В БОЮ</h1>'+
      '<div class="sub">Уровень '+player.level+' · Убито '+player.kills+'</div>'+
      '<div class="sub" style="color:#ffd76e;cursor:pointer;margin-top:20px;font-size:16px" '+
      'onclick="location.reload()">▸ НАЧАТЬ ЗАНОВО ◂</div>';
  }
}
function playerAttack(){
  const c=CLASSES[player.cls];
  player.atkCd=c.cd;player.attackT=0;player.hitDone=false;
  if(!c.ranged){
    for(let i=0;i<7;i++){
      const a=player.aim+rand(-c.arc/2,c.arc/2);
      const d=rand(c.range*0.5,c.range);
      particles.push({x:player.x+Math.cos(a)*d,y:player.y-8+Math.sin(a)*d*0.6,
        vx:0,vy:0,life:0.16,max:0.16,color:'#ffffff',size:2});
    }
  } else {
    const spd=c.projSpeed;
    projectiles.push({
      x:player.x+Math.cos(player.aim)*12,y:player.y-8+Math.sin(player.aim)*8,
      vx:Math.cos(player.aim)*spd,vy:Math.sin(player.aim)*spd,
      dmg:player.dmg,from:'player',life:1.3,kind:player.cls,
      color:player.cls==='mage'?'#7ae8ff':'#ffe8a0',r:4
    });
    burst(player.x+Math.cos(player.aim)*14,player.y-8+Math.sin(player.aim)*8,
      player.cls==='mage'?'#7ae8ff':'#ffe8a0',4,60);
  }
}
function doMeleeHit(){
  const c=CLASSES[player.cls];
  const range=c.range+c.range*0.15*(player.level-1)*0.1;
  let hitAny=false;
  for(const e of enemies){
    if(e.dead)continue;
    const dx=e.x-player.x,dy=e.y-player.y;
    const d=Math.hypot(dx,dy);
    if(d<range+e.r){
      const a=Math.atan2(dy,dx);
      if(Math.abs(angDiff(a,player.aim))<c.arc*0.5){
        const crit=player.cls==='assassin'&&Math.random()<0.25;
        damageEnemy(e,player.dmg,crit);hitAny=true;
      }
    }
  }
  if(hitAny)burst(player.x+Math.cos(player.aim)*range*0.7,
    player.y-8+Math.sin(player.aim)*range*0.5,'#ffffff',5,80);
}

/* ============================================================
   17. ОБНОВЛЕНИЕ
   ============================================================ */
function resolveCollision(ent,rad){
  const cx=Math.floor(ent.x/CHUNK_PX),cy=Math.floor(ent.y/CHUNK_PX);
  for(let j=cy-1;j<=cy+1;j++)for(let i=cx-1;i<=cx+1;i++){
    const ch=getChunk(i,j);
    for(const d of ch.decor){
      if(!d.r)continue;
      const dx=ent.x-d.x,dy=ent.y-d.y;
      const rr=d.r+rad,d2=dx*dx+dy*dy;
      if(d2<rr*rr&&d2>0.0001){
        const dl=Math.sqrt(d2);
        ent.x+=dx/dl*(rr-dl);ent.y+=dy/dl*(rr-dl);
      }
    }
  }
}

function updatePlayer(dt){
  const c=CLASSES[player.cls];
  player.dmg=c.dmg*player.dmgMult*(1+(player.level-1)*0.10);

  let mx=0,my=0;
  // клавиатура
  if(keys['w']||keys['ц']||keys['arrowup'])my--;
  if(keys['s']||keys['ы']||keys['arrowdown'])my++;
  if(keys['a']||keys['ф']||keys['arrowleft'])mx--;
  if(keys['d']||keys['в']||keys['arrowright'])mx++;

  // джойстик (перезаписывает клавиатуру, если активен)
  if(touchState.joystick.active){
    const j=touchState.joystick;
    const jdx=j.touchX-j.baseX,jdy=j.touchY-j.baseY;
    const jlen=Math.hypot(jdx,jdy);
    if(jlen>6){
      const norm=Math.min(1,jlen/JOY_RADIUS);
      mx=(jdx/jlen)*norm;
      my=(jdy/jlen)*norm;
    } else {mx=0;my=0;}
  }

  const len=Math.hypot(mx,my);
  if(len>0){mx/=len;my/=len;}

  const spd=PLAYER_SPEED*player.speedMul;
  player.x+=mx*spd*dt;
  player.y+=my*spd*dt;
  player.moving=len>0;
  if(player.moving)player.walkPhase=(player.walkPhase+dt*2.3)%1;

  resolveCollision(player,8);

  // прицел
  if(isTouch){
    // Авто-прицел: ближайший враг, иначе направление движения
    let nearest=null,nd=420;
    for(const e of enemies){
      if(e.dead)continue;
      const d=Math.hypot(e.x-player.x,e.y-player.y);
      if(d<nd){nd=d;nearest=e;}
    }
    if(nearest){
      player.aim=Math.atan2(nearest.y-player.y,nearest.x-player.x);
    } else if(player.moving){
      player.aim=Math.atan2(my,mx);
    }
  } else {
    const camX=player.x-VW/2,camY=player.y-VH/2;
    mouse.wx=camX+mouse.sx/SCALE;
    mouse.wy=camY+mouse.sy/SCALE;
    player.aim=Math.atan2(mouse.wy-player.y+8,mouse.wx-player.x);
  }
  player.facing=Math.cos(player.aim)>=0?1:-1;

  // атака
  if(player.atkCd>0)player.atkCd-=dt;
  const wantAttack=mouse.down||keys[' ']||touchState.attack.active;
  if(wantAttack&&player.atkCd<=0&&player.attackT<0)playerAttack();

  if(player.attackT>=0){
    player.attackT+=dt/(c.cd*0.72);
    if(!player.hitDone&&player.attackT>=0.33){
      player.hitDone=true;
      if(!c.ranged)doMeleeHit();
    }
    if(player.attackT>=1)player.attackT=-1;
  }
  if(player.invuln>0)player.invuln-=dt;
}

function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){enemies.splice(i,1);continue;}
    if(e.hitFlash>0)e.hitFlash-=dt;
    e.animT+=dt;
    const dx=player.x-e.x,dy=player.y-e.y;
    const dist=Math.hypot(dx,dy);
    const aggro=e.aggro;
    if(e.attackT>=0){
      e.attackT+=dt/0.45;
      if(e.attackT>=1)e.attackT=-1;
      e.moving=false;
      if(e.attackT>=0.5&&e.attackT<0.65&&!e.hitDone){
        e.hitDone=true;
        if(!e.ranged&&dist<e.atkRange+e.r+10){
          damagePlayer(e.dmg);
          const a=Math.atan2(player.y-e.y,player.x-e.x);
          player.x+=Math.cos(a)*6;player.y+=Math.sin(a)*6;
        }
      }
    } else if(dist<aggro){
      e.facing=dx>=0?1:-1;
      if(e.ranged){
        e.atkTimer-=dt;
        if(dist<e.atkRange&&e.atkTimer<=0){
          e.atkTimer=e.atkCd;e.attackT=0;e.hitDone=false;
          const a=Math.atan2(dy,dx);
          projectiles.push({
            x:e.x,y:e.y-e.r*1.6,vx:Math.cos(a)*210,vy:Math.sin(a)*210,
            dmg:e.dmg,from:'enemy',life:1.6,
            color:e.type==='witch'?'#7aff8a':'#e8e8d0',r:4
          });
        } else if(dist<90){
          e.x-=dx/dist*e.speed*0.6*dt;e.y-=dy/dist*e.speed*0.6*dt;e.moving=true;
        } else if(dist>e.atkRange*0.85){
          e.x+=dx/dist*e.speed*0.75*dt;e.y+=dy/dist*e.speed*0.75*dt;e.moving=true;
        } else e.moving=false;
      } else {
        if(dist>e.atkRange*0.85){
          e.x+=dx/dist*e.speed*dt;e.y+=dy/dist*e.speed*dt;e.moving=true;
        } else {
          if(e.atkTimer<=0){e.attackT=0;e.hitDone=false;e.atkTimer=e.atkCd;}
          else e.atkTimer-=dt;
          e.moving=false;
        }
      }
    } else {
      e.wanderT-=dt;
      if(e.wanderT<=0){e.wanderT=rand(1.2,3.2);e.wanderAng=Math.random()*TAU;}
      e.x+=Math.cos(e.wanderAng)*e.speed*0.28*dt;
      e.y+=Math.sin(e.wanderAng)*e.speed*0.28*dt;
      e.moving=true;e.facing=Math.cos(e.wanderAng)>=0?1:-1;
    }
    resolveCollision(e,e.r*0.7);
  }
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    let dead=p.life<=0;
    if(!dead){
      if(p.from==='player'){
        for(const e of enemies){
          if(e.dead)continue;
          const d=Math.hypot(e.x-p.x,(e.y-e.r*1.2)-p.y);
          if(d<e.r+p.r){damageEnemy(e,p.dmg,false);dead=true;break;}
        }
      } else {
        const d=Math.hypot(player.x-p.x,(player.y-10)-p.y);
        if(d<12){damagePlayer(p.dmg);dead=true;}
      }
    }
    if(dead){burst(p.x,p.y,p.color,4,70);projectiles.splice(i,1);}
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.y-=26*dt;f.life-=dt;
    if(f.life<=0)floaters.splice(i,1);
  }
}

function updateStructures(dt){
  const near=getStructuresNear(player.x,player.y,900);
  for(const s of near){
    if(s.bossSpawned||s.killed)continue;
    const d=Math.hypot(player.x-s.x,player.y-s.y);
    if(d<120)spawnBoss(s);
  }
}

const drawList=[];
function render(){
  const camX=Math.round(player.x-VW/2);
  const camY=Math.round(player.y-VH/2);
  gctx.fillStyle='#12200f';gctx.fillRect(0,0,VW,VH);
  gctx.save();gctx.translate(-camX,-camY);
  const t0x=Math.floor(camX/TS)-1,t1x=Math.floor((camX+VW)/TS)+1;
  const t0y=Math.floor(camY/TS)-1,t1y=Math.floor((camY+VH)/TS)+1;
  const ch0x=Math.floor(t0x/CHUNK),ch1x=Math.floor(t1x/CHUNK);
  const ch0y=Math.floor(t0y/CHUNK),ch1y=Math.floor(t1y/CHUNK);
  drawList.length=0;
  for(let cy=ch0y;cy<=ch1y;cy++)for(let cx=ch0x;cx<=ch1x;cx++){
    const ch=getChunk(cx,cy);
    const bx=cx*CHUNK,by=cy*CHUNK;
    for(let ty=0;ty<CHUNK;ty++)for(let tx=0;tx<CHUNK;tx++){
      const wx=bx+tx,wy=by+ty;
      if(wx<t0x||wx>t1x||wy<t0y||wy>t1y)continue;
      const t=ch.tiles[ty*CHUNK+tx];
      gctx.drawImage(TILE_CACHE[t.biome][t.v],wx*TS,wy*TS);
    }
    for(const d of ch.decor)drawList.push({y:d.y,kind:'decor',d});
  }
  const nearS=getStructuresNear(player.x,player.y,1000);
  for(const s of nearS){
    if(Math.abs(s.x-player.x)>VW+400||Math.abs(s.y-player.y)>VH+400)continue;
    drawList.push({y:s.y+8,kind:'struct',s});
  }
  for(const e of enemies)drawList.push({y:e.y,kind:'enemy',e});
  drawList.push({y:player.y,kind:'player'});
  drawList.sort((a,b)=>a.y-b.y);
  for(const item of drawList){
    if(item.kind==='decor'){
      const d=item.d;
      if(d.type==='rock')drawRock(gctx,d);else drawTree(gctx,d);
    } else if(item.kind==='struct'){
      drawStructure(gctx,item.s,time);
    } else if(item.kind==='enemy'){
      drawEnemy(gctx,item.e,time);
    } else {
      drawPlayer(gctx,time);
    }
  }
  for(const p of projectiles){
    const sx=Math.round(p.x),sy=Math.round(p.y);
    gctx.globalAlpha=0.35;ellipseFill(gctx,sx,sy,6,6,p.color);gctx.globalAlpha=1;
    R(gctx,sx-2,sy-2,4,4,p.color);R(gctx,sx-1,sy-1,2,2,'#ffffff');
  }
  for(const p of particles){
    gctx.globalAlpha=Math.max(0,p.life/p.max);
    R(gctx,p.x,p.y,p.size,p.size,p.color);
  }
  gctx.globalAlpha=1;gctx.restore();
  for(const f of floaters){
    gctx.globalAlpha=Math.min(1,f.life/f.max*1.6);
    gctx.font='bold 9px "Courier New",monospace';
    gctx.textAlign='center';
    gctx.fillStyle='#00000088';
    gctx.fillText(f.text,f.x-camX+1,f.y-camY+1);
    gctx.fillStyle=f.color;
    gctx.fillText(f.text,f.x-camX,f.y-camY);
    gctx.globalAlpha=1;
  }
  gctx.textAlign='left';
  const grd=gctx.createRadialGradient(VW/2,VH/2,VH*0.35,VW/2,VH/2,VH*0.95);
  grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,0.45)');
  gctx.fillStyle=grd;gctx.fillRect(0,0,VW,VH);
}

const FLASH=document.createElement('canvas');FLASH.width=160;FLASH.height=160;
const flashCtx=FLASH.getContext('2d');
function drawEnemy(g,e,t){
  if(e.hitFlash>0){
    flashCtx.setTransform(1,0,0,1,0,0);
    flashCtx.clearRect(0,0,160,160);
    flashCtx.save();
    flashCtx.translate(80,130);flashCtx.scale(e.facing*e.scale,e.scale);
    drawMonsterBody(flashCtx,e,t);
    flashCtx.restore();
    flashCtx.globalCompositeOperation='source-atop';
    flashCtx.fillStyle='rgba(255,255,255,0.8)';
    flashCtx.fillRect(0,0,160,160);
    flashCtx.globalCompositeOperation='source-over';
    g.drawImage(FLASH,Math.round(e.x-80),Math.round(e.y-130));
  } else {
    g.save();g.translate(Math.round(e.x),Math.round(e.y));
    g.scale(e.facing*e.scale,e.scale);
    drawMonsterBody(g,e,t);g.restore();
  }
  if(e.hp<e.maxhp||e.isBoss){
    if(!e.isBoss){
      const w=Math.round(e.r*2.4);
      const hpx=Math.round(e.x-w/2),hpy=Math.round(e.y-e.r*2.6-e.scale*10);
      R(g,hpx-1,hpy-1,w+2,5,'#000000aa');
      R(g,hpx,hpy,w,3,'#3a1010');
      R(g,hpx,hpy,Math.round(w*(e.hp/e.maxhp)),3,'#e04a4a');
    }
  }
}
function drawPlayer(g,t){
  const c=CLASSES[player.cls];
  const p=PAL[player.cls];
  g.save();
  if(player.invuln>0&&Math.floor(t*20)%2===0)g.globalAlpha=0.45;
  g.translate(Math.round(player.x),Math.round(player.y));
  if(player.level>1){
    g.globalAlpha=0.18*Math.min(1,(player.level-1)*0.3);
    ellipseFill(g,0,-2,13,5,'#ffd76e');
    g.globalAlpha=player.invuln>0&&Math.floor(t*20)%2===0?0.45:1;
  }
  g.scale(player.facing,1);
  humanoid(g,{
    pal:p,walk:player.moving?player.walkPhase:null,
    attack:player.attackT>=0?player.attackT:-1,
    hat:c.hat,torso:c.torso,weapon:c.wpn,shield:c.shield,t:t
  });
  g.restore();g.globalAlpha=1;
}

const MINIMAP=document.createElement('canvas');
MINIMAP.width=110;MINIMAP.height=110;
let mmTimer=0;
const mmCtx=MINIMAP.getContext('2d');
function updateMinimap(){
  const range=2000,step=range/MINIMAP.width;
  for(let y=0;y<MINIMAP.height;y+=3){
    for(let x=0;x<MINIMAP.width;x+=3){
      const wx=player.x-range/2+x*step;
      const wy=player.y-range/2+y*step;
      const b=biomeAt(wx,wy);
      mmCtx.fillStyle=BIOMES[b].map;
      mmCtx.fillRect(x,y,3,3);
    }
  }
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawHUD(){
  hctx.clearRect(0,0,CSSW,CSSH);

  hctx.font='bold 13px "Courier New",monospace';
  hctx.fillStyle='#ffd76e';
  hctx.fillText(c.name.toUpperCase()+' · ур.'+player.level,px+12,py+22);

  const hbw=pw-24;

  hctx.fillStyle=grad;
  hctx.fillRect(px+12,py+32,hbw*hpFrac,14);
  hctx.strokeStyle='#0a0a10';hctx.lineWidth=2;
  hctx.strokeRect(px+12,py+32,hbw,14);
  hctx.fillStyle='#ffffff';
  hctx.font='bold 10px "Courier New",monospace';
  hctx.fillText(Math.ceil(player.hp)+' / '+Math.ceil(player.maxhp),px+18,py+43);

  hctx.fillStyle='#101a28';hctx.fillRect(px+12,py+52,hbw,8);
  hctx.fillStyle='#5ac8e8';
  hctx.fillRect(px+12,py+52,hbw*(player.xp/player.xpNext),8);
  hctx.strokeStyle='#0a0a10';hctx.strokeRect(px+12,py+52,hbw,8);

  hctx.fillStyle='#8fa5c0';
  hctx.font='11px "Courier New",monospace';
  hctx.fillText('Оружие: '+c.weapon,px+12,py+76);

  // ---- биом
  const b=biomeAt(player.x,player.y);
  hctx.textAlign='center';
  hctx.font='bold 12px "Courier New",monospace';
  hctx.fillStyle='#8fa5c0';
  hctx.fillText(BIOMES[b].name.toUpperCase(),CSSW/2,26);
  hctx.font='10px "Courier New",monospace';
  hctx.fillStyle='#5f7291';
  hctx.fillText('Убито: '+player.kills,CSSW/2,42);
  hctx.textAlign='left';

  // ---- мини-карта
  const mw=Math.min(110,CSSW*0.22);
  const mx=CSSW-mw-14,my=14;
  hctx.save();
  hctx.globalAlpha=0.9;
  hctx.drawImage(MINIMAP,mx,my,mw,mw);
  hctx.restore();
  hctx.strokeStyle='#2e3d5c';hctx.lineWidth=2;
  hctx.strokeRect(mx,my,mw,mw);

  const range=2000;
  for(const s of getStructuresNear(player.x,player.y,900)){
    const dx=(s.x-player.x)/range*mw+mw/2;
    const dy=(s.y-player.y)/range*mw+mw/2;
    if(dx<0||dx>mw||dy<0||dy>mw)continue;
    hctx.fillStyle=s.killed?'#5f7291':'#ffd76e';
    hctx.fillRect(mx+dx-3,my+dy-3,6,6);
    hctx.strokeStyle='#000';hctx.lineWidth=1;
    hctx.strokeRect(mx+dx-3,my+dy-3,6,6);
  }
  hctx.fillStyle='#ffffff';
  hctx.fillRect(mx+mw/2-2,my+mw/2-2,5,5);
  hctx.strokeStyle='#000';hctx.strokeRect(mx+mw/2-2,my+mw/2-2,5,5);

  // ---- босс
  if(activeBoss&&!activeBoss.dead){
    const bw=Math.min(460,CSSW-40);
    const bx=(CSSW-bw)/2;
    const by=isTouch?CSSH-160:CSSH-70;
    hctx.fillStyle='rgba(10,14,24,0.85)';
    roundRect(hctx,bx-6,by-24,bw+12,52,8);hctx.fill();
    hctx.strokeStyle='#7a2a3a';hctx.lineWidth=2;
    roundRect(hctx,bx-6,by-24,bw+12,52,8);hctx.stroke();
    hctx.textAlign='center';
    hctx.font='bold 13px "Courier New",monospace';
    hctx.fillStyle='#ff8a8a';
    hctx.fillText(activeBoss.name,bx+bw/2,by-6);
    hctx.textAlign='left';
    hctx.fillStyle='#1a0e14';hctx.fillRect(bx,by,bw,16);
    const g2=hctx.createLinearGradient(bx,0,bx+bw,0);
    g2.addColorStop(0,'#a02a4a');g2.addColorStop(1,'#ff5a7a');
    hctx.fillStyle=g2;
    hctx.fillRect(bx,by,bw*clamp(activeBoss.hp/activeBoss.maxhp,0,1),16);
    hctx.strokeStyle='#0a0a10';hctx.lineWidth=2;
    hctx.strokeRect(bx,by,bw,16);
  }

  // ---- touch controls
  if(isTouch){
    drawTouchControls();
  } else if(player.kills<3){
    hctx.textAlign='center';
    hctx.font='11px "Courier New",monospace';
    hctx.fillStyle='rgba(200,215,235,'+(0.5+0.35*Math.sin(time*3))+')';
    hctx.fillText('WASD — движение   ·   ЛКМ — атака   ·   Ищи структуры с боссами',CSSW/2,CSSH-20);
    hctx.textAlign='left';
  }
}

function drawTouchControls(){
  // ---- кнопка атаки
  const ab=atkBtnPos();
  hctx.beginPath();
  hctx.arc(ab.x,ab.y,ATK_RADIUS,0,TAU);
  hctx.fillStyle=touchState.attack.active?'rgba(255,120,80,0.55)':'rgba(255,180,120,0.22)';
  hctx.fill();
  hctx.strokeStyle=touchState.attack.active?'#ffb060':'rgba(255,200,140,0.7)';
  hctx.lineWidth=3;
  hctx.stroke();
  // иконка меча
  hctx.save();
  hctx.translate(ab.x,ab.y);
  hctx.rotate(-0.6);
  hctx.fillStyle='#fff8e0';
  hctx.fillRect(-2,-20,4,26);
  hctx.fillRect(-8,4,16,4);
  hctx.restore();
  // подпись
  hctx.fillStyle='#fff8e0';
  hctx.font='bold 10px "Courier New",monospace';
  hctx.textAlign='center';
  hctx.fillText('АТАКА',ab.x,ab.y+ATK_RADIUS+14);
  hctx.textAlign='left';

  // ---- джойстик
  const j=touchState.joystick;
  if(j.active){
    // база
    hctx.beginPath();
    hctx.arc(j.baseX,j.baseY,JOY_RADIUS,0,TAU);
    hctx.strokeStyle='rgba(180,220,255,0.55)';
    hctx.lineWidth=3;
    hctx.stroke();
    hctx.fillStyle='rgba(120,180,255,0.10)';
    hctx.fill();
    // ручка
    const dx=j.touchX-j.baseX,dy=j.touchY-j.baseY;
    const dl=Math.hypot(dx,dy);
    const cl=Math.min(dl,JOY_RADIUS);
    const kx=j.baseX+(dl>0?dx/dl*cl:0);
    const ky=j.baseY+(dl>0?dy/dl*cl:0);
    hctx.beginPath();
    hctx.arc(kx,ky,24,0,TAU);
    hctx.fillStyle='rgba(140,200,255,0.55)';
    hctx.fill();
    hctx.strokeStyle='rgba(200,230,255,0.85)';
    hctx.lineWidth=2;
    hctx.stroke();
  } else {
    // подсказка-плейсхолдер
    const hx=80,hy=CSSH-80;
    hctx.beginPath();
    hctx.arc(hx,hy,JOY_RADIUS,0,TAU);
    hctx.strokeStyle='rgba(180,220,255,0.20)';
    hctx.lineWidth=2;
    hctx.stroke();
    hctx.beginPath();
    hctx.arc(hx,hy,22,0,TAU);
    hctx.fillStyle='rgba(140,200,255,0.15)';
    hctx.fill();
    hctx.fillStyle='rgba(180,220,255,0.4)';
    hctx.font='10px "Courier New",monospace';
    hctx.textAlign='center';
    hctx.fillText('ХОДЬБА',hx,hy+JOY_RADIUS+14);
    hctx.textAlign='left';
  }
}

let lastTime=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastTime)lastTime=now;
  let dt=(now-lastTime)/1000;
  lastTime=now;
  dt=Math.min(dt,0.05);
  if(gameState!=='playing')return;
  time+=dt;
  updatePlayer(dt);
  updateEnemies(dt);
  updateProjectiles(dt);
  updateParticles(dt);
  updateSpawner(dt);
  updateStructures(dt);
  mmTimer-=dt;
  if(mmTimer<=0){mmTimer=0.5;updateMinimap();}
  render();
  drawHUD();
}

function startGame(cls){
  document.getElementById('menu').style.display='none';
  buildTiles();
  chunks.clear();
  structures.clear();
  enemies=[];projectiles=[];particles=[];floaters=[];
  activeBoss=null;time=0;
  player=makePlayer(cls);
  let tries=0;
  while(tries<60){
    let blocked=false;
    const cx=Math.floor(player.x/CHUNK_PX),cy=Math.floor(player.y/CHUNK_PX);
    for(let j=cy-1;j<=cy+1;j++)for(let i=cx-1;i<=cx+1;i++){
      const ch=getChunk(i,j);
      for(const d of ch.decor){
        if(Math.hypot(d.x-player.x,d.y-player.y)<40){blocked=true;break;}
      }
      if(blocked)break;
    }
    if(!blocked)break;
    player.x+=40;tries++;
  }
  updateMinimap();
  gameState='playing';
  lastTime=0;
}

/* ============================================================
   22. ЗАПУСК
   ============================================================ */
buildMenu();
requestAnimationFrame(loop);
</script>
